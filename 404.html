<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<script>if(location.protocol==="http:"&&location.hostname==="skysite.no")location.replace("https://skysite.no"+location.pathname+location.search+location.hash)</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Siden finnes ikke – Skysite</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F5F6FA">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link href="/fonts/fonts.css" rel="stylesheet">
<style>
  :root{--bg:#F3F5F9;--ink:#141B33;--muted:#50587A;--sun:#FFB547}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.6 "Schibsted Grotesk",system-ui,sans-serif}
  header{padding:0 1.5rem;height:68px;display:flex;align-items:center;max-width:1168px;width:100%;margin:0 auto}
  .brand{display:inline-flex;align-items:center;gap:.6rem;text-decoration:none;color:var(--ink);font-weight:750;font-size:1.2rem}
  .brand img{width:34px;height:34px}
  main{flex:1;display:flex;align-items:center;padding:2rem 1.5rem 4rem}
  .box{max-width:1120px;width:100%;margin:0 auto}
  h1{font-size:clamp(2.2rem,5vw,3.6rem);font-weight:800;letter-spacing:-.035em;line-height:1.04;margin:0 0 1rem;max-width:14ch}
  p{color:var(--muted);max-width:40ch;margin:0 0 2rem}
  .actions{display:flex;gap:.8rem;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;min-height:48px;padding:0 1.3rem;border-radius:10px;font-weight:650;text-decoration:none;color:var(--ink);border:2px solid var(--ink)}
  .btn-sun{background:var(--sun);border-color:var(--sun)}
  .btn-sun:hover{background:#FFA41F;border-color:#FFA41F}
  .btn-line:hover{background:var(--ink);color:#fff}
  :focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:4px}
</style>
</head>
<body>
<header><a class="brand" href="/"><img src="/logo.svg" alt="" width="34" height="34">Skysite</a></header>
<main>
  <div class="box">
    <h1>Denne siden finnes ikke.</h1>
    <p>Lenken kan være feil, eller siden er flyttet. Feilkode 404.</p>
    <div class="actions">
      <a class="btn btn-sun" href="/">Gå til forsiden</a>
      <a class="btn btn-line" href="/eksempel/rorlegger/">Se et eksempel</a>
    </div>
  </div>
</main>
<script src="/analytics.js" defer></script>
</body>
</html>
